name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # SEG-005 — Secret scanning. Roda em todo push/PR e BLOQUEIA o pipeline
  # (job obrigatório) se encontrar algo com cara de segredo no diff analisado.
  # Sempre marcar este check como "required" em Settings → Branches, tanto
  # para main quanto para develop.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (histórico completo para o gitleaks comparar o range certo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repo público: não precisa de GITLEAKS_LICENSE. Se o repo virar
          # privado, criar o secret GITLEAKS_LICENSE (ver docs do gitleaks-action)
          # e descomentar a linha abaixo.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  quality:
    name: Lint • Types • Test • Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      WAVE_SESSION_SECRET: "ci-dummy-secret-not-used-in-runtime"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build (sem migrate)
        run: npx next build

      # SEG-006 Teste 2 — confirma que nenhum padrão de segredo estruturado
      # (connection string, chave privada, prefixo de API key conhecido)
      # foi parar no bundle enviado ao navegador (.next/static/). Roda a
      # cada build — não é uma verificação pontual.
      - name: Varredura de segredos no bundle do cliente
        run: node scripts/security/scan-client-bundle.mjs
